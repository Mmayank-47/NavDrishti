[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nav-shield"
version = "1.0.0"
description = "NAV-SHIELD: Intelligent Dead Reckoning & Resilient Multi-Sensor Navigation Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "networkx>=3.0"
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0"
]
test = [
    "pytest>=7.3.0"
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
